<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Identity Recall</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="mark.svg" alt=""><span>Identity Recall</span></div>
      <button class="icon-button" id="openDashboard" title="Open dashboard" aria-label="Open dashboard">↗</button>
    </header>
    <section id="loading" class="empty">Remembering…</section>
    <section id="content" hidden>
      <div class="site-head">
        <div><div class="eyebrow">This website</div><h1 id="siteName"></h1></div>
        <span class="count" id="count"></span>
      </div>
      <div id="accounts"></div>
      <div id="empty" class="empty" hidden><div class="orb">✦</div><strong>No account remembered yet</strong><div>Log in normally, or add one below.</div></div>
      <form id="addForm">
        <input id="emailInput" type="email" autocomplete="email" placeholder="Add an email manually" required>
        <button class="primary" type="submit">Remember</button>
      </form>
      <p class="privacy">Stored only on this device · No passwords</p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
